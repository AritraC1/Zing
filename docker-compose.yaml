name: zing

services:
  postgres:
    image: postgres:16
    container_name: zing-db
    restart: unless-stopped
    env_file:
      - server/.env
    ports:
      # Host port 5433 to avoid clashing with any other local Postgres;
      # containers on the compose network still reach it as `postgres:5432`
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zing-network

  # Redis backs the Socket.IO pub/sub adapter, the presence registry
  # (keys with TTL) and distributed rate limiting. Single-instance
  # deployments can still run without it — the server degrades to
  # in-process behavior when REDIS_URL is unset.
  redis:
    image: redis:7-alpine
    container_name: zing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - zing-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: zing-backend
    ports:
      - "3000:3000"
      # mediasoup SFU WebRTC media ports (RTC_MIN_PORT..RTC_MAX_PORT)
      - "40000-40100:40000-40100/udp"
      - "40000-40100:40000-40100/tcp"
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      FRONTEND_URL: http://localhost
      # Inside the compose network the DB is reachable as `postgres:5432`
      # (this overrides the localhost:5433 URL in server/.env)
      DATABASE_URL: postgresql://zing:zing%407111030@postgres:5432/zing_db
      # Same for Redis: compose network name overrides the localhost URL
      REDIS_URL: redis://redis:6379
      # SFU: advertise the Docker host IP so ICE candidates reach the
      # browser through the mapped port range above.
      SFU_ANNOUNCED_IP: ${SFU_ANNOUNCED_IP:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zing-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_BASE_URL: /api
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    container_name: zing-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - zing-network

volumes:
  postgres-data:
  redis-data:

networks:
  zing-network:
    driver: bridge